worker_processes 1;
error_log  /data/data/com.termux/files/home/debz_ai/logs/nginx-error.log;
pid        /data/data/com.termux/files/home/debz_ai/logs/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log         /data/data/com.termux/files/home/debz_ai/logs/nginx-access.log;
    sendfile           on;
    client_max_body_size 50m;
    include        /data/data/com.termux/files/usr/etc/nginx/mime.types;

    server {
        listen       8080;
        server_name  _;

        root   /data/data/com.termux/files/home/debz_ai;
        index  index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass   unix:/data/data/com.termux/files/home/debz_ai/logs/webui-fpm.sock;
            fastcgi_index  index.php;
            include        /data/data/com.termux/files/usr/etc/nginx/fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            fastcgi_read_timeout 3600;
            fastcgi_send_timeout 3600;
            fastcgi_buffering off;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
